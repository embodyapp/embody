services:
  postgres:
    image: postgres:16-alpine
    container_name: embody-postgres
    environment:
      POSTGRES_USER: embody
      POSTGRES_PASSWORD: embody
      POSTGRES_DB: embody
    ports:
      - "5432:5432"
    volumes:
      - embody-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U embody -d embody"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  embody-pgdata:
