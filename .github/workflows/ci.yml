name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  terraform:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - run: terraform -chdir=infra/mvp/m05 fmt -check -recursive
      - run: terraform -chdir=infra/mvp/m05 init -backend=false -lockfile=readonly
      - run: terraform -chdir=infra/mvp/m05 validate

  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm license:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm api-report
      - run: pnpm format:check

  postgres-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    env:
      # Disposable public fixture credentials, never customer/provider credentials.
      EMBODY_POSTGRES_URL: postgresql://embody_runtime:fixture-only-runtime@127.0.0.1:5432/embody_test
      EMBODY_POSTGRES_MIGRATION_URL: postgresql://embody_migrator:fixture-only-migrator@127.0.0.1:5432/embody_test
      EMBODY_POSTGRES_OTHER_URL: postgresql://embody_other:fixture-only-other@127.0.0.1:5432/embody_other
      EMBODY_PLATFORM_URL: postgresql://embody_platform_runtime:fixture-only-platform-runtime@127.0.0.1:5432/embody_platform
      EMBODY_PLATFORM_MIGRATION_URL: postgresql://embody_platform_migrator:fixture-only-platform-migrator@127.0.0.1:5432/embody_platform
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Provision isolated disposable app databases and least-privilege roles
        run: psql -v ON_ERROR_STOP=1 -f test/postgres/init.sql
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: postgres
          PGPASSWORD: postgres
      - name: Deliberate missing-configuration and false-green regressions
        run: pnpm test:verification
      - name: Mandatory app/platform PostgreSQL, multi-gateway, kernel, contract and gateway cases (zero skips)
        run: pnpm test:mvp
        env:
          EMBODY_POSTGRES_TEST_CONTAINER: ${{ job.services.postgres.id }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: postgres-mvp-evidence-node-${{ matrix.node }}
          path: .artifacts/verification/*.json
          if-no-files-found: error

  # Keep the protected PostgreSQL check stable while requiring both supported Node majors.
  postgres:
    runs-on: ubuntu-latest
    needs: [postgres-matrix]
    if: always()
    steps:
      - name: Require both mandatory PostgreSQL/MVP matrix runs
        env:
          MATRIX_RESULT: ${{ needs['postgres-matrix'].result }}
        run: test "$MATRIX_RESULT" = success

  e2e-artifacts-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@11
      - run: npm --version
      - run: pnpm test:baseline
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: baseline-evidence-node-${{ matrix.node }}
          path: .artifacts/verification/*.json
          if-no-files-found: error

  # Preserve the existing protected check name without weakening its Node 22/24 gate.
  e2e-artifacts:
    runs-on: ubuntu-latest
    needs: [e2e-artifacts-matrix]
    if: always()
    steps:
      - name: Require both packed/distributed matrix runs to succeed
        env:
          MATRIX_RESULT: ${{ needs['e2e-artifacts-matrix'].result }}
        run: test "$MATRIX_RESULT" = success
