# Which directories hold workspace packages. The buckets are split by ROLE IN THE
# ECOSYSTEM — see PLUGINS.md. The question each answers is "does this ship, and to
# whom?", not "who owns it".
packages:
  # ── published to npm ────────────────────────────────────────────────────────
  - "packages/*" # the runtime and the SPI: plugin-sdk, kernel, core, db, auth, host, cli, mcp-server
  - "plugins/*" # first-party plugins, built on the public SPI exactly as a stranger would
  - "ui/*" # browser packages, on their own version line — not part of the embody package
  # ── never published ─────────────────────────────────────────────────────────
  - "demo/*" # showcase apps, to look at rather than copy
  - "examples/*" # reference code to copy: the canonical app, example plugins
  - "custom/*" # (transitional) folds into examples/custom-crm
  - "deploy/*" # (transitional) folds into examples/custom-crm
