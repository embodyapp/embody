# Which directories hold workspace packages. The buckets are split by ROLE IN THE
# ECOSYSTEM — see PLUGINS.md. The question each answers is "does this ship, and to
# whom?", not "who owns it".
packages:
  # ── published to npm ────────────────────────────────────────────────────────
  - "packages/*" # the runtime and the SPI: plugin-sdk, kernel, core, db, auth, host, cli, mcp-server
  - "framework/*" # (transitional) react — moves to ui/ in the next step
  # ── not published ───────────────────────────────────────────────────────────
  - "catalog/*" # first-party apps a deployment can enable
  - "examples/*" # reference deployment + demo UI
  - "custom/*" # your plugins
  - "deploy/*" # your deployables
